<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular black background as shown in the official logo image -->
  <circle cx="256" cy="256" r="240" fill="#000000" stroke="#111111" stroke-width="4" />
  
  <g transform="translate(15, 5)">
    <!-- Green corner logo mark -->
    <path d="M 0,40
             C 0,15 15,0 40,0
             L 95,0
             C 95,15 85,25 70,25
             L 40,25
             C 30,25 25,30 25,40
             L 25,70
             C 25,85 15,95 0,95
             Z" transform="translate(85, 155) scale(0.95)" fill="#00DF66"/>
             
    <!-- 'graphoria' text -->
    <text x="185" y="235" 
          font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-size="68" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="-2px">graphoria</text>
          
    <!-- 'CREATIVITY DESIGN' text -->
    <text x="240" y="295" 
          font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-size="20" 
          font-weight="600" 
          fill="#ffffff" 
          letter-spacing="9px" 
          text-anchor="middle">CREATIVITY DESIGN</text>
  </g>
</svg>